<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>How we measure</title>
    <link rel="stylesheet" href="../header.css">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0a0c10;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      /* the canvas fills the whole viewport, so the bar overlays it rather
         than reserving space in normal flow */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: transparent;
        box-shadow: none;
      }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
            }
        }
    </script>
  </head>
  <body>
    <div class="topbar">
      <a href=".." class="back-btn" aria-label="Back to home">← Back</a>
      <a href="https://novac-community.org/" target="_blank" rel="noopener">
        <img src="../NOVAC_logo.png" alt="NOVAC logo">
      </a>
      <a class="doc-btn" href="../docs/measurement-documentation.pdf" target="_blank" rel="noopener" aria-label="View measurement documentation (PDF)" title="View measurement documentation (PDF)">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.3h6c0-1.1.4-1.8 1-2.3A7 7 0 0 0 12 2Z"/>
        </svg>
      </a>
    </div>
    <canvas id="threeCanvas"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
