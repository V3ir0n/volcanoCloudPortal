<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="../NOVAC_logo.png">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../buttons.css">
  <style>
    body {
      margin: 0;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
    }
    main {
      padding: calc(var(--topbar-h) + 24px) 24px 24px;
      display: flex;
      justify-content: center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
    <div class="topbar">
      <a href="./index.html" class="back-btn" aria-label="Back to model page">← Back</a>
      <span class="topbar-title">Eruptive regimes</span>
    </div>
    <main>
        <div id="vis"></div>
    </main>
    <script type="module">
        import {eruptiveRegimes} from "./src/constants.js"
        const spec = {
            $schema: "https://vega.github.io/schema/vega-lite/v6.json",
            data: {values: eruptiveRegimes},
            background: "transparent",
            config: {
                font: "JetBrains Mono, monospace",
                axis: { labelColor: "#2b2b2b", titleColor: "#2b2b2b", gridColor: "#cfc9b8", domainColor: "#cfc9b8", tickColor: "#cfc9b8" },
                legend: { labelColor: "#2b2b2b", titleColor: "#2b2b2b" },
                view: { stroke: "transparent" }
            },
            mark: {
                type: "point",
                size: 200,
                filled: true
            },
            encoding: {
                x: {
                    field: "gas",
                    type: "quantitative",
                    title: "Gas (%)"
                },
                y: {
                    field: "depth",
                    type: "quantitative",
                    title: "Depth (km)",
                    scale: {reverse: true}
                },
                color: {
                    field: "regime",
                    type: "nominal",
                    title: "Regime"
                },
                shape: {field: "regime", type: "nominal"}
            }
        };

        vegaEmbed("#vis", spec, {renderer: "canvas", actions: false});
    </script>
</body>
</html>
